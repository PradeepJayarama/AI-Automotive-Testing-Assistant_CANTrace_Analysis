[project]
name = "ai-automotive-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pradeep Jayarama", email = "pradeep.jayarama@elektrobit.com" }
]
requires-python = ">=3.10"
dependencies = [
    "can>=0.0.0",
    "github-copilot-sdk>=0.1.25",
    "pandas>=2.3.3",
    "python-can>=4.6.1",
    "python-dotenv>=1.2.2",
    "streamlit>=1.60.0",
]

[project.scripts]
ai-automotive-assistant = "ai_automotive_assistant:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
